name: Probe egadev reachability

on:
  push:
    branches: [chore/probe-egadev-reach]

permissions: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: health, expect 200
        run: curl -sS -o /dev/null -w '%{http_code} %{remote_ip} %{time_connect}\n' --max-time 20 https://egadev.uio.no/bifrost/health
      - name: version without a signature, expect 401
        if: always()
        run: curl -sS -o /dev/null -w '%{http_code} %{remote_ip} %{time_connect}\n' --max-time 20 https://egadev.uio.no/bifrost/api/version
