name: Release Pre Publish Check

on:
  merge_group:
    branches:
      - main

jobs:
  resolve_pr:
    name: Resolve merge group PR
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: read

    outputs:
      pr_number: ${{ steps.resolve.outputs.pr_number }}

    steps:
      - name: Resolve PR number
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          MERGE_GROUP_SHA: ${{ github.sha }}
        run: |
          prs=$(gh api \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${REPOSITORY}/commits/${MERGE_GROUP_SHA}/pulls")

          pr_count=$(echo "$prs" | jq 'length')

          if [ "$pr_count" -ne 1 ]; then
            echo "::error::Expected exactly one PR for the merge group, but found $pr_count."
            exit 1
          fi

          pr_number=$(echo "$prs" | jq -r '.[0].number')

          if [ -z "$pr_number" ] || [ "$pr_number" = "null" ]; then
            echo "::error::The PR number could not be resolved for this merge group."
            exit 1
          fi

          echo "Resolved PR number: $pr_number"
          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"

      - name: Print PR number (step output)
        run:
          echo "Step output: ${{ steps.resolve.outputs.pr_number }}"

  print_pr:
    name: Print PR number
    runs-on: ubuntu-latest
    needs: resolve_pr

    steps:
      - name: Print PR number (job output)
        run:
          echo "Job output: ${{ needs.resolve_pr.outputs.pr_number }}"

      - name: Fail the workflow
        run: exit 1