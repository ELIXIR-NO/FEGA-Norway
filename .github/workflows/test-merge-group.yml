name: Release Pre Publish Check

on:
  merge_group:
    branches:
      - main

jobs:
  resolve_pr:
    name: Resolve merge group PR
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: read

    outputs:
      pr_number: ${{ steps.resolve.outputs.pr_number }}

    steps:
      - name: Resolve PR number
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          MERGE_GROUP_SHA: ${{ github.sha }}
        run: |
            echo "Resolving PR number for merge group with head_branch"
            head_branch=$(gh run view "$RUN_ID" \
            --repo "$REPOSITORY" \
            --json headBranch \
            --jq '.headBranch')
            echo "Merge group head branch: $head_branch"
            pr_number=$(echo "$head_branch" \
              | sed -nE 's|.*/pr-([0-9]+)-.*|\1|p')
            echo "PR number: $pr_number"
            if [ -z "$pr_number" ]; then
              echo "::error::The PR number could not be resolved from merge group branch: $head_branch"
              exit 1
            fi

            echo "Resolved PR number: $pr_number"

  print_pr:
    name: Print PR number
    runs-on: ubuntu-latest
    needs: resolve_pr

    steps:
      - name: Print PR number (job output)
        run: |
          echo "Job output: ${{ needs.resolve_pr.outputs.pr_number }}"

      - name: Fail the workflow
        run: exit 1