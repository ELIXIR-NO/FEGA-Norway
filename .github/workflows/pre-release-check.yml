name: Release Pre Check
on:
  merge_group:
  pull_request:
    branches:
      - main

jobs:
  detect:
    uses: ./.github/workflows/detect-changed-components.yml

  check_build:
    if: ${{ github.event_name == 'pull_request' }}
    needs: detect
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        component: ${{ fromJson(needs.detect.outputs.changed-components).component }}

    steps:
      - uses: actions/checkout@v7
    # Build JARs
      - name: Setup Java
        if: ${{ matrix.component == 'clearinghouse' || matrix.component == 'crypt4gh' || matrix.component == 'tsd-file-api-client' }}
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Build JAR Files
        if: ${{ matrix.component == 'clearinghouse' || matrix.component == 'crypt4gh' || matrix.component == 'tsd-file-api-client'}}

        run: |
          ./gradlew lib:${{matrix.component}}:clean lib:${{matrix.component}}:build 
      

      # Build Docker images
      - name: Build docker images
        if: ${{ matrix.component == 'cega-mock' || matrix.component == 'mq-interceptor' }}
        uses: docker/build-push-action@v7.3.0
        with:
          context: ./services/${{ matrix.component }}
          # Ignore push
          push: false
          provenance: false
          sbom: false
          no-cache: 'true'

      - name: Build docker images
        if: ${{ matrix.component == 'localega-tsd-proxy'  || matrix.component == 'tsd-api-mock'}}
        uses: docker/build-push-action@v7.3.0
        with:
          file: ./services/${{ matrix.component }}/Dockerfile
          context: .
          # Ignore push
          push: false
          no-cache: 'true'
          provenance: false
          sbom: false

  resolve_pr:
    name: Resolve merge group PR
    if: ${{ github.event_name == 'merge_group' }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: read

    outputs:
      pr_number: ${{ steps.resolve.outputs.pr_number }}

    steps:
      - name: Resolve PR number
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          MERGE_GROUP_SHA: ${{ github.sha }}
        run: |
          prs=$(gh api \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${REPOSITORY}/commits/${MERGE_GROUP_SHA}/pulls")

          pr_count=$(echo "$prs" | jq 'length')

          if [ "$pr_count" -ne 1 ]; then
            echo "::error::Expected exactly one PR for the merge group, but found $pr_count."
            exit 1
          fi

          pr_number=$(echo "$prs" | jq -r '.[0].number')

          echo "Resolved PR number: $pr_number"
          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"

  check_publish:
    if: ${{ github.event_name == 'merge_group' }}
    needs:
      - detect
      - resolve_pr
    runs-on: ubuntu-latest
    permissions:
        contents: read
        packages: write
    strategy:
      matrix:
        component: ${{ fromJson(needs.detect.outputs.changed-components).component }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Java
        if: ${{ matrix.component == 'clearinghouse' || matrix.component == 'crypt4gh' || matrix.component == 'tsd-file-api-client' || matrix.component == 'localega-tsd-proxy' || matrix.component == 'tsd-api-mock'}}
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Check publishing JAR file for tsd-file-api-client
        if: ${{matrix.component == 'tsd-file-api-client' }}
        run: |
          ./gradlew :lib:${{matrix.component}}:publish --dry-run

      - name: Build and publish to local staging for JReleaser
        if: ${{ matrix.component == 'clearinghouse' || matrix.component == 'crypt4gh'}}
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          ./gradlew lib:${{matrix.component}}:clean lib:${{matrix.component}}:build lib:${{matrix.component}}:publishMavenJavaPublicationToLocalStagingRepository \
            -Pversion=1.0.0-DRYRUN

      - name: Run JReleaser
        if: ${{ matrix.component == 'clearinghouse' || matrix.component == 'crypt4gh'}}
        uses: jreleaser/release-action@v2
        env:
          JRELEASER_PROJECT_VERSION: 1.0.0-DRYRUN
          JRELEASER_MAVENCENTRAL_USERNAME: dummy
          JRELEASER_MAVENCENTRAL_TOKEN: dummy
        with:
          arguments: deploy --dry-run -c lib/${{matrix.component}}/jreleaser.yml

      - name: Print Logs
        if: ${{ always() && (matrix.component == 'clearinghouse' || matrix.component == 'crypt4gh')}}
        run: |
          echo "TRACE LOG:"
          cat lib/${{matrix.component}}/out/jreleaser/trace.log || echo "No trace log found"
          echo "OUTPUT PROPERTIES:"
          cat lib/${{matrix.component}}/out/jreleaser/output.properties || echo "No output properties found"

      - name: Set Repository Name
        if: ${{ matrix.component == 'localega-tsd-proxy' || matrix.component == 'tsd-api-mock' || matrix.component == 'cega-mock' || matrix.component == 'mq-interceptor' }}
        id: repo_name
        run: |
          REPO_NAME=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "repo_name=$REPO_NAME" >> $GITHUB_ENV

      - name: Log in to the Github Container registry
        if: ${{ matrix.component == 'localega-tsd-proxy' || matrix.component == 'tsd-api-mock' || matrix.component == 'cega-mock' || matrix.component == 'mq-interceptor' }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        if: ${{ matrix.component == 'cega-mock' || matrix.component == 'mq-interceptor' }}
        uses: docker/build-push-action@v7.3.0
        with:
          context: ./services/${{ matrix.component }}
          # Ignore push on merge_group events
          push: true
          provenance: false
          sbom: false
          no-cache: 'true'
          # Use the PR number to tag the images
          tags: |
            ghcr.io/${{ env.repo_name }}:${{ matrix.component }}-${{ needs.resolve_pr.outputs.pr_number }}
          labels: |
            org.opencontainers.image.source=${{ github.event.repository.clone_url }}
            org.opencontainers.image.created=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and push
        if: ${{ matrix.component == 'localega-tsd-proxy'  || matrix.component == 'tsd-api-mock'}}
        uses: docker/build-push-action@v7.3.0
        with:
          file: ./services/${{ matrix.component }}/Dockerfile
          context: .
          push: true
          no-cache: 'true'
          provenance: false
          sbom: false
          # Use the PR number to tag the images
          tags: |
            ghcr.io/${{ env.repo_name }}:${{ matrix.component }}-${{ needs.resolve_pr.outputs.pr_number }}
          labels: |
            org.opencontainers.image.source=${{ github.event.repository.clone_url }}
            org.opencontainers.image.created=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Set up Go
        if: ${{ matrix.component == 'lega-commander' }}
        uses: actions/setup-go@v7
        with:
          go-version: 1.26
      - name: Run GoReleaser
        if: ${{ matrix.component == 'lega-commander' }}
        uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: release --clean --snapshot
          workdir: cli/lega-commander

      - name: Set component path
        run: |
          declare -A component_paths=(
           [lega-commander]="cli:lega-commander"
            [e2e]="e2e"
            [e2eTests]="e2eTests"
            [clearinghouse]="lib:clearinghouse"
            [crypt4gh]="lib:crypt4gh"
            [tsd-file-api-client]="lib:tsd-file-api-client"
            [cega-mock]="services:cega-mock"
            [localega-tsd-proxy]="services:localega-tsd-proxy"
            [mq-interceptor]="services:mq-interceptor"
            [tsd-api-mock]="services:tsd-api-mock"
          )
          echo "component_path=${component_paths[${{ matrix.component }}]}" >> $GITHUB_ENV

      - name: Generate Fancy Changelog
        run: |
          ./gradlew ${{ env.component_path }}:generateChangelog \
            -Pversion=v1.0.0 \
            -PprTitle="pre-release-check"
