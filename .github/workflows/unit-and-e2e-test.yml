name: Unit and e2e tests

on:
  push:
  workflow_dispatch:
    inputs:
      e2e_suite:
        description: "Which e2e runner to exercise the stack with"
        type: choice
        options: [go, java]
        default: go

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    env:
      # Pushes always run the Go suite; the retiring JUnit suite is available on
      # demand from the Actions tab until the Go one has proven itself.
      E2E_SUITE: ${{ inputs.e2e_suite || 'go' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.26
          cache-dependency-path: |
            cli/lega-commander/go.sum
            services/mq-interceptor/go.sum
            services/cega-mock/go.sum
            e2e/go.sum

      - name: Cache gradle packages
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Assemble
        run: ./gradlew assemble

      - name: Run unit tests of all components
        run: ./gradlew :lib:crypt4gh:test :lib:clearinghouse:test :lib:tsd-file-api-client:test :services:tsd-api-mock:test :services:mq-interceptor:test :services:localega-tsd-proxy:test :services:cega-mock:test :cli:lega-commander:test :e2e:test


      - name: Start e2e environment (${{ env.E2E_SUITE }} suite)
        run: ./dev.sh start

      - name: Wait for e2e tests
        run: |
          echo "Waiting for e2e-tests container to complete..."
          while [ "$(docker inspect --format='{{.State.Running}}' e2e-tests 2>/dev/null)" == "true" ]; do
            echo "e2e-tests still running, waiting for 5 seconds..."
            sleep 5
          done

          echo "=============== e2e-tests Container Logs ==============="
          docker logs e2e-tests
          echo "========================================================"

          EXIT_CODE=$(docker inspect --format='{{.State.ExitCode}}' e2e-tests)
          if [ $EXIT_CODE -ne 0 ]; then
            echo "e2e tests failed with exit code $EXIT_CODE"
            exit 1
          else
            echo "e2e tests completed successfully"
          fi

      - name: Containers status
        if: failure()
        run: |
          docker ps -a
